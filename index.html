<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TicketPro RD — Control de Ventas de Boletas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>


<script src="js/config.js"></script>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark">
          <img src="assets/logo-icon.png" alt="TicketPro RD" />
        </div>
        <div class="brand-text">
          <div class="brand-title">TicketPro RD</div>
          <div class="brand-sub">Control de boletas</div>
        </div>
      </div>
      <div class="brand-flag-bar"></div>
    </div>

    <div>
      <div class="nav-group-label">Taquilla</div>
      <nav class="nav" id="sidebar-nav"></nav>
    </div>

    <div class="sidebar-foot">
      <div class="clock" id="clock">—</div>
      Sistema conectado a la API local
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title-row">
          <span class="topbar-eyebrow" id="topbar-eyebrow"></span>
        </div>
        <h1 id="topbar-title">Panel</h1>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>

    <div class="content" id="content">
      <div id="conn-banner" class="conn-banner"></div>
    </div>
  </div>
</div>

<button class="btn btn-ghost btn-icon" id="btn-refresh" title="Recargar datos"
  style="position:fixed; bottom:22px; left:22px; z-index:50;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px">
    <path d="M21 12a9 9 0 1 1-2.6-6.36M21 4v5h-5"/>
  </svg>
</button>

<div id="modal-root"></div>
<div class="toast-stack" id="toast-stack"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
